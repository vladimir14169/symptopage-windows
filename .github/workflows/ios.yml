name: iOS core tests and builds
# macOS runner: SwiftPM tests of SymptoPageCore against the shared fixtures,
# then UNSIGNED builds of the SwiftUI app:
#   - SymptoPage-unsigned.ipa  (iphoneos; must be signed by the installer, e.g.
#     Xcode, Sideloadly or AltStore with your Apple Account, before it can run)
#   - SymptoPage-Simulator.zip (runs only in the iOS Simulator on a Mac)
on:
  push:
    paths: ['ios/**', 'tests/fixtures/**', 'core/i18n.js', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Tool versions
        run: xcodebuild -version && swift --version && sw_vers
      - name: Core tests (SwiftPM)
        id: coretests
        continue-on-error: true
        working-directory: ios/SymptoPageCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-tests.log
      - name: Generate Xcode project
        working-directory: ios
        run: brew install xcodegen && xcodegen generate
      - name: Package source with generated Xcode project
        run: |
          mkdir -p ios/out
          cp IOS_SETUP_RU.md ios/
          zip -qry ios/out/SymptoPage-iOS-source.zip ios -x 'ios/out/*' 'ios/build*' 'ios/SymptoPageCore/.build/*' 'ios/.gitignore'
          rm ios/IOS_SETUP_RU.md
          grep -E 'objectVersion' ios/SymptoPage.xcodeproj/project.pbxproj
      - name: Build for iPhone (unsigned) and package .ipa
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project SymptoPage.xcodeproj -scheme SymptoPage -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ../build-device.log 2>&1 || { grep -E 'error:' ../build-device.log | head -60; exit 1; }
          grep -E 'BUILD SUCCEEDED' ../build-device.log
          mkdir -p out/Payload && cp -R build/Build/Products/Release-iphoneos/SymptoPage.app out/Payload/
          (cd out && zip -qry SymptoPage-unsigned.ipa Payload)
      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -project SymptoPage.xcodeproj -scheme SymptoPage -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build > ../build-sim.log 2>&1 || { grep -E 'error:' ../build-sim.log | head -60; exit 1; }
          (cd build-sim/Build/Products/Debug-iphonesimulator && zip -qry ../../../../out/SymptoPage-Simulator.zip SymptoPage.app)
      - name: Smoke run in iOS Simulator (screenshots)
        working-directory: ios
        run: |
          set -x
          mkdir -p ../shots
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          APP=build-sim/Build/Products/Debug-iphonesimulator/SymptoPage.app
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" app.symptopage.ios; sleep 8
          xcrun simctl io "$DEV" screenshot ../shots/1-first-run.png
          xcrun simctl terminate "$DEV" app.symptopage.ios || true
          # Synthetic TEST data from the Windows core (Polish UI, 2 doctors, entries, course).
          C=$(xcrun simctl get_app_container "$DEV" app.symptopage.ios data)
          mkdir -p "$C/Library/Application Support/SymptoPage"
          cp ../tests/fixtures/v2-sample.json "$C/Library/Application Support/SymptoPage/records.json"
          xcrun simctl launch "$DEV" app.symptopage.ios; sleep 8
          xcrun simctl io "$DEV" screenshot ../shots/2-with-test-data.png
          # The app must still be running (no crash).
          xcrun simctl spawn "$DEV" launchctl list | grep -i symptopage | tee ../shots/running.txt
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i symptopage && exit 1 || true
          # The data file must still be valid v2 after launch.
          python3 -c "import json;d=json.load(open('$C/Library/Application Support/SymptoPage/records.json'));assert d['schemaVersion']==2;print('records ok',len(d['entries']))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-simulator-screenshots
          path: shots/
      - name: Checksums
        working-directory: ios/out
        run: shasum -a 256 *.ipa *.zip | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SymptoPage-iOS-unsigned
          path: |
            ios/out/*.ipa
            ios/out/*.zip
            ios/out/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ios-build-logs
          path: |
            core-tests.log
            build-device.log
            build-sim.log
      - name: Fail if core tests failed
        if: steps.coretests.outcome == 'failure'
        run: |
          grep -E 'error|failed' core-tests.log | head -40
          exit 1
