# Reproducible Xcode project: `brew install xcodegen && xcodegen generate` (see IOS_SETUP_RU.md).
# The generated SymptoPage.xcodeproj is not committed.
name: SymptoPage
options:
  bundleIdPrefix: app.symptopage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Opens in Xcode 15.0 and newer (Xcode 16+ format would lock out Xcode 15).
  projectFormat: xcode15_0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your own Team in Xcode (Signing & Capabilities) or here: DEVELOPMENT_TEAM: ABCDE12345
    CODE_SIGN_STYLE: Automatic
packages:
  SymptoPageCore:
    path: SymptoPageCore
targets:
  SymptoPage:
    type: application
    platform: iOS
    sources:
      - path: SymptoPage
    dependencies:
      - package: SymptoPageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.symptopage.ios   # change to your own reverse-domain ID
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SymptoPage
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  SymptoPage:
    build:
      targets:
        SymptoPage: all
    test:
      targets: []
